[package]
name = "astra-vm"
version = "0.4.0"
edition = "2021"
description = "AstraOS Virtual Machine Manager"
license = "MIT"
authors = ["AstraOS Project"]

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
which = "6.0"

[[bin]]
name = "astra-vm"
path = "src/main.rs"
