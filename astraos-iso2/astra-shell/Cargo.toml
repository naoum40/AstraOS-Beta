[package]
name = "astra-shell"
version = "0.2.0"
edition = "2021"
description = "AstraOS Desktop Shell"
license = "MIT"
authors = ["AstraOS Project <hello@astraos.org>"]

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
zbus = "4.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "astra-shell"
path = "src/main.rs"
