#
# AstraOS Live — systemd-boot loader configuration
# Path on the ISO: /loader/loader.conf
#
# Default boot entry: AstraOS Live (x86_64)
# Auto-boot after 10 seconds (10 * 1s systemd-boot units = 10s timeout).

default astraos
timeout 10
console-mode keep
editor no
