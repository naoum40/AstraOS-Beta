[package]
name = "astra-sticky-notes"
version = "0.4.0"
edition = "2021"
description = "AstraOS Sticky Notes"
license = "MIT"
authors = ["AstraOS Project"]

[dependencies]
gtk4 = "0.9"
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "astra-sticky-notes"
path = "src/main.rs"
