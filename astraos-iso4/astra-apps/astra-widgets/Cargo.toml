[package]
name = "astra-widgets"
version = "0.4.0"
edition = "2021"
description = "AstraOS Desktop Widgets"
license = "MIT"
authors = ["AstraOS Project"]

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
# `toml` is required to parse ~/.config/astra/widgets.toml as specified by
# the config contract; not present in the original task Cargo.toml but the
# spec mandates the on-disk format. Adding it keeps the spec's TOML file
# format intact while still passing `cargo check`.
toml = "0.8"

[[bin]]
name = "astra-widgets"
path = "src/main.rs"
