[package]
name = "astra-pass"
version = "0.4.0"
edition = "2021"
description = "AstraOS Password Manager"
license = "MIT"
authors = ["AstraOS Project"]

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "astra-pass"
path = "src/main.rs"
