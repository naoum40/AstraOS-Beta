# mkinitcpio preset for AstraOS
# The `archiso` hook is not provided by the standard Arch repos in this build
# context; keeping it here causes mkinitcpio to fail during ISO creation.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"
