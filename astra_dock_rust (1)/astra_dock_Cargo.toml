[package]
name = "astra-dock"
version = "0.1.0"
edition = "2021"
authors = ["AstraOS"]
description = "macOS-style dock for AstraOS (traduit de MacOSDock → Rust/GTK4)"

[lib]
name = "astra_dock"
path = "src/lib.rs"

[[bin]]
name = "astra-dock"
path = "src/main.rs"

[dependencies]
gtk4 = "0.9"
glib = "0.20"
gio = "0.20"
gtk4-layer-shell = "0.3"
graphene-rs = "0.20"
