# AstraOS Hyprland config

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Splash Hyprland désactivé (comme Omarchy)
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

monitor=,preferred,auto,1

$terminal = kitty
$menu = wofi --show drun 2>/dev/null || true
$browser = firefox 2>/dev/null || true

exec-once = pipewire
exec-once = wireplumber
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent
exec-once = hyprpaper 2>/dev/null || true
exec-once = astra-shell

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    active_opacity = 0.95
    inactive_opacity = 0.85
}

input {
    kb_layout = fr
    follow_mouse = 1
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7a59ffaa) rgba(5a4affaa) 45deg
    col.inactive_border = rgba(595959aa)
}

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Apps
bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER, M, exit,
bind = SUPER, D, exec, $menu
bind = SUPER, B, exec, $browser

# Window management
bind = SUPER, F, fullscreen,
bind = SUPER, Space, togglefloating,
bind = SUPER, Tab, cyclenext,
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Window rules pour astra-shell (barre en BAS)
windowrule = float, class:^(org.astraos.Shell)$
windowrule = pin, class:^(org.astraos.Shell)$
windowrule = move 0 100%-48, class:^(org.astraos.Shell)$
windowrule = size 100% 48, class:^(org.astraos.Shell)$
windowrule = nofocus, class:^(org.astraos.Shell)$
windowrule = noborder, class:^(org.astraos.Shell)$
