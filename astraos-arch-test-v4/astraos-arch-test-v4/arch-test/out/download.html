<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstraOS — Télécharger</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono'), local('Consolas'), local('Menlo');
  }

  :root {
    --bg: #0d1117;
    --bg-raised: #151b23;
    --border: #2a323d;
    --text: #d7dee6;
    --text-dim: #7d8894;
    --accent: #5ec9a6;
    --accent-dim: #3a7a63;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a4552; }

  .content { padding: 32px 28px 28px; }

  .prompt { color: var(--accent-dim); font-size: 13px; margin: 0 0 4px; }

  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .version { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .meta span.k { color: var(--text); }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0d1117;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn:hover { background: #79d6b6; }
  .btn:active { background: var(--accent-dim); }

  .btn svg { flex-shrink: 0; }

  .hash {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    word-break: break-all;
    line-height: 1.6;
  }

  .hash .k { color: var(--text-dim); display: block; margin-bottom: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background 0.15s ease, transform 0.1s ease; }
    .btn:active { transform: scale(0.98); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="bar">
    <span class="dot"></span>
    <span>astraos-live.iso</span>
  </div>
  <div class="content">
    <p class="prompt">$ ls -lh out/</p>
    <h1>AstraOS Live</h1>
    <p class="version">v0.7.0 · x86_64 · BIOS + UEFI</p>

    <div class="meta">
      <div><span class="k">Fichier</span> — <span id="filename">astraos-0.7.0-x86_64.iso</span></div>
      <div><span class="k">Taille</span> — <span id="filesize">vérification...</span></div>
    </div>

    <a class="btn" id="dl" href="./astraos-arch-test-0.7-test-x86_64.iso" download>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 1V11M8 11L4.5 7.5M8 11L11.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 13.5H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Télécharger l'ISO
    </a>

    <div class="hash">
      <span class="k">Note</span>
      Lien direct (pas de blob JS) — pas de limite de taille, reprise possible si le navigateur le supporte.
    </div>
  </div>
</div>

<script>
  // Ajuste automatiquement le nom de fichier si tu changes le lien ci-dessus.
  const link = document.getElementById('dl');
  document.getElementById('filename').textContent = link.getAttribute('href').replace('./', '');

  // Tente d'afficher la taille réelle du fichier via une requête HEAD (si le serveur la fournit).
  fetch(link.href, { method: 'HEAD' })
    .then(res => {
      const len = res.headers.get('content-length');
      const sizeEl = document.getElementById('filesize');
      if (len) {
        const gb = (parseInt(len, 10) / (1024 ** 3)).toFixed(2);
        sizeEl.textContent = gb + ' Go';
      } else {
        sizeEl.textContent = 'inconnue';
      }
    })
    .catch(() => {
      document.getElementById('filesize').textContent = 'inconnue';
    });
</script>

</body>
</html>
